# Pruebas de integración: dbkomainos_test con un esquema que se recrea en cada corrida, nunca DBKomainOS
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${KOMAINOS_TEST_DB_URL:jdbc:postgresql://localhost:5432/dbkomainos_test}
    username: ${KOMAINOS_TEST_DB_USUARIO:postgres}
    password: ${KOMAINOS_TEST_DB_CLAVE:${KOMAINOS_DB_CLAVE}}

komainos:
  seguridad:
    jwt:
      secreto: c2VjcmV0by1kZS1wcnVlYmFzLXNvbG8tcGFyYS1lbC1wZXJmaWwtdGVzdA==
      expiracion-minutos: 15
    administrador-inicial:
      clave: ""
  credenciales:
    llave-maestra: bGxhdmUtZGUtcHJ1ZWJhcy1zb2xvLXBhcmEtZWwtaXQ=
  planificacion:
    proceso-automatico:
      habilitado: false
