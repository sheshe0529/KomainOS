spring:
  application:
    name: komainos-backend

  # Las variables de entorno pueden venir de un archivo .env local (ignorado por
  # git). Ningun secreto del sistema se versiona (RNF03).
  config:
    import: optional:file:.env[.properties]

  # Importacion del inventario (RF12): un archivo de hasta 5 MB por solicitud.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${KOMAINOS_DB_URL:jdbc:postgresql://localhost:5432/DBKomainOS}
    username: ${KOMAINOS_DB_USUARIO:postgres}
    password: ${KOMAINOS_DB_CLAVE}
    hikari:
      # El esquema tiene mayusculas: sin comillas PostgreSQL lo buscaria como
      # "komainos". Fijarlo en cada conexion hace que las consultas nativas y
      # los tipos enumerados se resuelvan en el esquema correcto.
      connection-init-sql: SET search_path TO "KomainOS"

  jpa:
    # validate: Hibernate comprueba al arrancar que las entidades coinciden con
    # las tablas y nunca modifica la base. El esquema se crea con
    # scripts/bd/01_esquema.sql (DEC-34); si una entidad y su tabla dejan de
    # coincidir, la aplicacion no arranca.
    hibernate:
      ddl-auto: validate
    # Cerrar la sesion JPA al salir del servicio obliga a armar los DTO dentro
    # de la transaccion y evita consultas ocultas durante la serializacion.
    open-in-view: false
    properties:
      hibernate:
        default_schema: '"KomainOS"'
        # Las columnas son TIMESTAMP(0) sin zona con valores UTC (DEC-06): los
        # Instant se guardan como hora UTC sin desplazamiento.
        jdbc.time_zone: UTC
        type.preferred_instant_jdbc_type: TIMESTAMP

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${KOMAINOS_PUERTO:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

komainos:
  seguridad:
    jwt:
      # Sin valor por defecto a proposito: si falta la variable la aplicacion
      # no arranca en vez de firmar tokens con un secreto conocido (RNF03).
      secreto: ${KOMAINOS_JWT_SECRETO}
      # Respaldo si configuracion_sistema aun no tiene fila; el valor vigente
      # es configuracion_sistema.minutos_expiracion_token (RF02).
      expiracion-minutos: ${KOMAINOS_JWT_EXPIRACION_MINUTOS:60}
    cors:
      origenes: ${KOMAINOS_CORS_ORIGENES:http://localhost:5180}
    # Solo se usa si no existe ningun administrador (DEC-21).
    administrador-inicial:
      codigo: ${KOMAINOS_ADMIN_CODIGO:admin}
      nombre: ${KOMAINOS_ADMIN_NOMBRE:Administrador del sistema}
      clave: ${KOMAINOS_ADMIN_CLAVE_INICIAL:}
  planificacion:
    # Zona en la que se interpretan las ventanas permisivas (DEC-06).
    zona-horaria: ${KOMAINOS_ZONA_HORARIA:America/Lima}
    # Horizonte maximo de busqueda del algoritmo voraz (DEC-12).
    horizonte-dias: 365
    # Frecuencia del proceso que genera las ordenes automaticas (RF27, RF29).
    proceso-automatico:
      habilitado: true
      intervalo: PT15M
