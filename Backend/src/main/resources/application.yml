spring:
  application:
    name: komainos-backend

  # Las variables de entorno pueden venir de un .env local ignorado por git (RNF03)
  config:
    import: optional:file:.env[.properties]

  # Importación del inventario (RF12): hasta 5 MB por archivo
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${KOMAINOS_DB_URL:jdbc:postgresql://localhost:5432/DBKomainOS}
    username: ${KOMAINOS_DB_USUARIO:postgres}
    password: ${KOMAINOS_DB_CLAVE}
    hikari:
      # El esquema tiene mayúsculas: sin comillas PostgreSQL lo buscaría como "komainos"
      connection-init-sql: SET search_path TO "KomainOS"

  jpa:
    # validate: Hibernate comprueba las entidades contra las tablas y nunca modifica la base (DEC-34)
    hibernate:
      ddl-auto: validate
    # Obliga a armar los DTO dentro de la transacción y evita consultas ocultas al serializar
    open-in-view: false
    properties:
      hibernate:
        default_schema: '"KomainOS"'
        # Columnas TIMESTAMP(0) sin zona con valores UTC (DEC-06)
        jdbc.time_zone: UTC
        type.preferred_instant_jdbc_type: TIMESTAMP

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${KOMAINOS_PUERTO:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

komainos:
  seguridad:
    jwt:
      # Sin valor por defecto: si falta la variable la aplicación no arranca (RNF03)
      secreto: ${KOMAINOS_JWT_SECRETO}
      # Respaldo si configuracion_sistema aún no tiene fila (RF02)
      expiracion-minutos: ${KOMAINOS_JWT_EXPIRACION_MINUTOS:60}
    cors:
      origenes: ${KOMAINOS_CORS_ORIGENES:http://localhost:5180}
    # Solo se usa si no existe ningún administrador (DEC-21)
    administrador-inicial:
      codigo: ${KOMAINOS_ADMIN_CODIGO:admin}
      nombre: ${KOMAINOS_ADMIN_NOMBRE:Administrador del sistema}
      clave: ${KOMAINOS_ADMIN_CLAVE_INICIAL:}
  credenciales:
    # Llave AES-256 en base64 sin valor por defecto: si falta la aplicación no arranca (RNF02, RNF03)
    llave-maestra: ${KOMAINOS_CREDENCIALES_LLAVE}
    # Tiempo durante el que el panel muestra un secreto revelado (RF08)
    segundos-revelado: 30
  planificacion:
    # Zona en la que se interpretan las ventanas permisivas (DEC-06)
    zona-horaria: ${KOMAINOS_ZONA_HORARIA:America/Lima}
    # Horizonte máximo de búsqueda del algoritmo voraz (DEC-12)
    horizonte-dias: 365
    # Frecuencia del proceso que genera las órdenes automáticas (RF27, RF29)
    proceso-automatico:
      habilitado: true
      intervalo: PT15M

  automatizacion:
    # SIMULADO responde sin conectarse a los servidores; REAL invoca ansible-playbook (solo en un controlador Linux)
    modo: ${KOMAINOS_AUTOMATIZACION_MODO:SIMULADO}
    # Revisiones periódicas, evaluaciones previas, vencimientos y cola de ejecución (EA02-EA06)
    proceso-habilitado: ${KOMAINOS_AUTOMATIZACION_PROCESO_HABILITADO:true}
    intervalo-ms: ${KOMAINOS_AUTOMATIZACION_INTERVALO_MS:30000}
    # Conexiones remotas abiertas a la vez entre análisis y tareas (RNF08)
    max-conexiones-simultaneas: ${KOMAINOS_AUTOMATIZACION_MAX_CONEXIONES:10}
    ansible:
      ejecutable: ${KOMAINOS_ANSIBLE_EJECUTABLE:ansible-playbook}
      timeout-conexion-segundos: ${KOMAINOS_ANSIBLE_TIMEOUT_CONEXION:30}
      ssh:
        puerto: ${KOMAINOS_ANSIBLE_SSH_PUERTO:22}
        # Desactivar solo en laboratorio: sin verificación no se detecta un servidor suplantado
        verificar-clave-host: ${KOMAINOS_ANSIBLE_SSH_VERIFICAR_CLAVE_HOST:true}
        archivo-known-hosts: ${KOMAINOS_ANSIBLE_SSH_KNOWN_HOSTS:}
      winrm:
        puerto: ${KOMAINOS_ANSIBLE_WINRM_PUERTO:5986}
        esquema: ${KOMAINOS_ANSIBLE_WINRM_ESQUEMA:https}
        # ntlm para cuentas locales, kerberos para cuentas de dominio
        transporte: ${KOMAINOS_ANSIBLE_WINRM_TRANSPORTE:ntlm}
        # Desactivar solo en laboratorio con certificados autofirmados
        validar-certificado: ${KOMAINOS_ANSIBLE_WINRM_VALIDAR_CERTIFICADO:true}
    simulacion:
      # Pausa por operación simulada para observar los estados intermedios en el panel
      retardo-ms: ${KOMAINOS_SIMULACION_RETARDO_MS:0}
