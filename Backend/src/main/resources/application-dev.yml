spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.komainos: DEBUG

komainos:
  automatizacion:
    # En una máquina sin Ansible (Windows) cada operación remota fallaría: el proceso automático no las intenta salvo
    # que se active explícitamente. Los botones del panel siguen disponibles
    proceso-habilitado: ${KOMAINOS_AUTOMATIZACION_PROCESO_HABILITADO:false}
