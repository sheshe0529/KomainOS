# Pruebas de KomainOS (DEC-58): en cada pull request a main y antes de cada despliegue (las llama despliegue.yml).
# El EC2 solo despliega un commit de main cuando estos tres jobs terminaron bien (despliegue/vigilar.py busca sus
# nombres: si se cambian, hay que cambiar también PRUEBAS allí).
name: Pruebas

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Las pruebas de integración recrean el esquema "KomainOS" en esta base en cada corrida (DEC-22)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dbkomainos_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbkomainos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unitarias, de controladores y de integración contra PostgreSQL 18
        run: mvn -B -ntp verify -Pintegracion
        env:
          KOMAINOS_TEST_DB_URL: jdbc:postgresql://localhost:5432/dbkomainos_test
          KOMAINOS_TEST_DB_USUARIO: postgres
          KOMAINOS_TEST_DB_CLAVE: postgres

  panel:
    name: Pruebas del panel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Tipos y compilación
        run: npm run build

  despliegue:
    name: Pruebas del despliegue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis de los scripts del EC2
        run: |
          bash -n despliegue/desplegar.sh despliegue/instalar.sh despliegue/confiar-winrm.sh
          shellcheck -S warning despliegue/desplegar.sh despliegue/instalar.sh despliegue/confiar-winrm.sh
          python3 -m py_compile despliegue/vigilar.py
      - name: Decisión de despliegue
        working-directory: despliegue
        run: python3 -m unittest -v prueba_vigilar.py
